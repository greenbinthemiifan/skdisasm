name: Build Sonic 3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.3

      - name: Check Lua version
        run: lua5.3 -v
     
      - name: Check assembler files
        run: |
          ls -l build_tools/Linux-x86_64/        
